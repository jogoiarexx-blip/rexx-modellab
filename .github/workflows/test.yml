name: ModelLab tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node cli/modellab.js render examples/caixa.modellab.json --out render-check --size 128
      - uses: actions/upload-artifact@v4
        with:
          name: render-check
          path: render-check/
